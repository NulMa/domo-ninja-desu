# 빠른 티어 CI — 매 푸시마다 돈다. 목표 2분 이내. (19 §3 P0-6)
#
# 여기 있는 검사 3종은 전부 "문서에 적어둔 규칙을 기계가 강제하게 만든 것"이다.
#   ① 경계 가드   — core 가 UnityEngine 을 참조하지 못하게
#   ② 커밋 규약   — 09 의 형식을 실제로 지키게
#   ③ 게이트 2    — sim 이 CI 에서 dotnet 으로 돈다
#
# 사람이 지켜야 하는 규칙보다 어길 수 없는 규칙이 낫다.

name: fast

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  guard:
    name: 경계 가드 · 커밋 규약
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────
      # ① core 의 의존 방향
      #
      # asmdef 의 noEngineReferences 가 Unity 쪽에서 이미 막는다.
      # 그런데 asmdef 는 dotnet 빌드에 관여하지 않는다 — sim/tests 경로로
      # UnityEngine 참조가 들어오면 Unity 를 켜기 전까지 아무도 모른다.
      # 가드를 두 겹으로 두는 이유가 이것이다. (19 §2.3)
      # ─────────────────────────────────────────────────────────
      - name: core 가 Unity 를 참조하지 않는지
        run: |
          set -u

          # using 선언과 정규화된 사용만 본다.
          # 주석에서 'UnityEngine' 을 언급하는 것까지 잡으면 — 이 저장소의 주석은
          # 경계를 설명하느라 그 단어를 자주 쓴다 — 가드가 오탐으로 무력해진다.
          # 주석 줄은 제외한다.
          HITS=$(grep -rnE '(^\s*using\s+Unity(Engine|Editor)\b|\bUnity(Engine|Editor)\.)' \
                   core/ --include='*.cs' \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' || true)

          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::core/ 에 Unity 참조가 있다. core 는 Unity 없이 컴파일돼야 한다 (D-12)."
            echo "sim 과 tune 이 Unity 없이 도는 것이 밸런스 루프 전체의 전제다."
            exit 1
          fi
          echo "core 경계 OK — Unity 참조 없음"

      # ─────────────────────────────────────────────────────────
      # ② 커밋 규약 (09 §1)
      #
      # husky + commitlint 를 쓰지 않은 이유: .git/hooks 는 버전 관리 대상이
      # 아니라 심사자에게 보이지 않는다. CI 는 로그에 남는다. (14 §3.5)
      # ─────────────────────────────────────────────────────────
      - name: 커밋 메시지 규약 검사
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u

          if [ "$EVENT" = "pull_request" ]; then
            SHAS=$(git rev-list --no-merges "$PR_BASE".."$PR_HEAD")
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            SHAS=$(git rev-list --no-merges "$BEFORE"..HEAD)
          else
            # 최초 푸시 등 이전 지점을 알 수 없는 경우
            SHAS=$(git rev-list --no-merges --max-count=20 HEAD)
          fi

          [ -z "$SHAS" ] && { echo "검사할 커밋 없음"; exit 0; }

          FAIL=0
          for sha in $SHAS; do
            SUBJECT=$(git log -1 --format=%s "$sha")
            BODY=$(git log -1 --format=%b "$sha")
            SHORT="${sha:0:7}"

            # 주체 태그가 제목 맨 앞에 있어야 한다.
            # 트레일러가 아니라 제목에 두는 이유는 git log --oneline 으로
            # 심사자가 AI/사람 경계를 한 번에 읽을 수 있어야 하기 때문이다.
            if ! printf '%s' "$SUBJECT" | grep -qE '^\[(AI|H|BAL|REV)\] '; then
              echo "::error::$SHORT 주체 태그 없음 — [AI]/[H]/[BAL]/[REV] 로 시작해야 한다"
              echo "         $SUBJECT"
              FAIL=1
              continue
            fi

            TAG=$(printf '%s' "$SUBJECT" | sed -E 's/^\[([A-Z]+)\].*/\1/')

            require() {
              if ! printf '%s' "$BODY" | grep -q "$1"; then
                echo "::error::$SHORT [$TAG] 커밋에 '$1' 이 없다 — 09 §1.3"
                echo "         $SUBJECT"
                FAIL=1
              fi
            }

            require '의도:'
            case "$TAG" in
              AI)  require '검증:' ;;
              BAL) require '검증:'; require '지표:'; require '근거:' ;;
              REV) require '지표:' ;;
            esac
          done

          [ "$FAIL" = "0" ] && echo "커밋 규약 OK" || exit 1

  build:
    name: 빌드 · 테스트 · 게이트 2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: NuGet 캐시
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore DomoNinja.sln

      - run: dotnet build DomoNinja.sln --no-restore -c Release

      - name: 결정론 회귀 테스트
        run: dotnet test DomoNinja.sln --no-build -c Release

      # ─────────────────────────────────────────────────────────
      # ③ 게이트 2 — sim 이 CI 에서 실제로 실행된다
      #
      # 테스트와 별개로 두는 이유: 여기서 도는 건 배포되는 것과 같은
      # 실행 파일이다. 빌드 설정(Release 최적화)이 결정론을 깨는 경우가
      # 실제로 있어서, 산출물 자체로도 확인해야 한다.
      # ─────────────────────────────────────────────────────────
      - name: 게이트 2 — sim 결정론 자체 점검
        run: |
          SIM=$(find artifacts/bin/DomoNinja.Sim -name 'DomoNinja.Sim.dll' | head -1)
          if [ -z "$SIM" ]; then
            echo "::error::sim 산출물을 찾지 못했다. Directory.Build.props 의 ArtifactsPath 확인."
            exit 1
          fi
          dotnet "$SIM" --selftest
